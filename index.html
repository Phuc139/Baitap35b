<!DOCTYPE html>

<head>

    <title>Đồng hồ đếm ngược - 221A010581</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-box">
        <h1>Đồng hồ đếm ngược</h1>
        <p class="info">Họ tên: <strong>HUỲNH THANH PHÚC</strong> | MSSV: <strong>221A010581</strong></p>

        <div id="timerDisplay">10:00</div>

        <div class="btn-group">
